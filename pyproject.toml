[project]
name = "smpl-avatar"
version = "0.1.1"
description = "Generate SMPL / SMPL-H body avatars from height and weight in ComfyUI: shaded render, exact silhouette mask, depth map and 24 body-part masks for ControlNet-style conditioning."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Corentin Euvrard" }]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
# torch and numpy are provided by ComfyUI and deliberately not listed.
# smplx is distributed under a non-commercial research license: see README.
# pyrender is vendored (smpl_avatar/_vendor); these are its runtime dependencies.
dependencies = [
    "smplx>=0.1.28",
    "PyOpenGL>=3.1.9",
    "pyglet>=1.4.10,<3",
    "trimesh",
    "networkx",
    "Pillow",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/corentineuvrard/ComfyUI-SMPL"

[tool.comfy]
PublisherId = "corentineuvrard"
DisplayName = "SMPL Avatar"
Icon = ""
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Keep temporary test folders (synthetic model files) only for failed tests.
tmp_path_retention_policy = "failed"
